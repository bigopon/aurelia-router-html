name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for this release (for example, v0.1.0-rc.0)
        required: true
        type: string
      confirm:
        description: Type PUBLISH to submit the package to npm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error title=Release tag does not match package version::Expected $expected_tag but received $RELEASE_TAG."
            exit 1
          fi

          if ! git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"; then
            echo "::error title=Release tag does not point at HEAD::Expected $RELEASE_TAG to point at $(git rev-parse --short HEAD)."
            echo "Tags pointing at HEAD:"
            git tag --points-at HEAD
            exit 1
          fi

      - run: npm ci
      - run: npm --prefix docs-app ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:node
      - run: npm run test:matcher
      - run: npm run test:e2e:ci
      - run: npm run build:doc
      - run: npm --prefix docs-app run typecheck
      - run: npm --prefix docs-app run test:e2e:ci
      - run: npm pack --dry-run

      - name: Publish stable release
        run: npm publish
