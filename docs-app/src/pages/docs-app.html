<div class="docs-shell">
  <div class="docs-grid">
    <main class="main-panel">
      <au-route path="/" title="Overview">
        <overview-page></overview-page>
      </au-route>

      <au-route path="why-router-html" title="Why Router HTML">
        <why-router-html-page></why-router-html-page>
      </au-route>

      <au-route path="api" title="API Cheat Sheet">
        <api-cheat-sheet-page></api-cheat-sheet-page>
      </au-route>

      <au-route path="features/basic" title="Basic Routes">
        <feature-basic-page></feature-basic-page>
      </au-route>

      <au-route path="features/nested" title="Nested Routes">
        <feature-nested-page></feature-nested-page>
      </au-route>

      <au-route path="features/params" title="Params">
        <feature-params-page></feature-params-page>
      </au-route>

      <au-route path="features/segment-constraints" title="Segment Constraints">
        <feature-segment-constraints-page></feature-segment-constraints-page>
      </au-route>

      <au-route path="features/url-state" title="Query, Hash & URL Modes">
        <feature-url-state-page></feature-url-state-page>
      </au-route>

      <au-route path="features/hash-scrolling" title="Scrolling &amp; Restoration">
        <feature-hash-scrolling-page></feature-hash-scrolling-page>
      </au-route>

      <au-route path="features/focus" title="Focus Management">
        <feature-focus-page></feature-focus-page>
      </au-route>

      <au-route path="features/active-links" title="Active Links">
        <feature-active-links-page></feature-active-links-page>
      </au-route>

      <au-route path="features/programmatic" title="Programmatic Navigation">
        <feature-programmatic-page></feature-programmatic-page>
      </au-route>

      <au-route path="features/redirects" title="Redirects">
        <feature-redirects-page></feature-redirects-page>
      </au-route>

      <au-route path="features/titles" title="Page Titles">
        <feature-titles-page></feature-titles-page>
      </au-route>

      <au-route path="features/lifecycle" title="Loading &amp; Loaded">
        <feature-lifecycle-page></feature-lifecycle-page>
      </au-route>

      <au-route path="features/guards" title="Navigation Guards">
        <feature-guards-page></feature-guards-page>
      </au-route>

      <au-route path="features/guard-failure" title="Guard Failure Modes">
        <feature-guard-failure-page></feature-guard-failure-page>
      </au-route>

      <au-route path="features/error-recovery" title="Error Recovery">
        <feature-error-recovery-page></feature-error-recovery-page>
      </au-route>

      <au-route path="features/adapters" title="Routing Adapters">
        <feature-adapters-page></feature-adapters-page>
      </au-route>

      <au-route path="features/conditional" title="Conditional">
        <feature-conditional-page></feature-conditional-page>
      </au-route>

      <au-route path="features/repeated" title="Repeated">
        <feature-repeated-page></feature-repeated-page>
      </au-route>

      <au-route path="features/matching" title="Exact & Fallback">
        <feature-matching-page></feature-matching-page>
      </au-route>

      <au-route path="features/wildcards" title="Wildcard Paths">
        <feature-wildcard-page></feature-wildcard-page>
      </au-route>

      <au-route path="features/swap" title="Swap Order">
        <feature-swap-page></feature-swap-page>
      </au-route>

      <au-route path="features/animation" title="Animations">
        <feature-animation-page></feature-animation-page>
      </au-route>

      <au-route path="features/shared-state" title="Shared State">
        <feature-shared-state-page></feature-shared-state-page>
      </au-route>

      <au-route path="features/kitchen-sink" title="Kitchen Sink">
        <feature-kitchen-sink-page></feature-kitchen-sink-page>
      </au-route>

      <au-route path="playground" title="Playground">
        <playground-page
          example-id.bind="$route.residue === '/' ? null : $route.residue.slice(1)">
        </playground-page>
      </au-route>
    </main>

    <aside class="sidebar">
      <div class="brand-stack">
        <div class="brand-row">
          <img class="brand-mark" src="/router-html-icon-128-v2.png" alt="Router HTML" />
          <div>
            <h1>Router HTML</h1>
            <div class="muted">Aurelia html based router</div>
          </div>
        </div>
      </div>

      <nav class="nav-list">
        <a
          repeat.for="item of nav"
          au-link.bind="item.path"
          class="nav-item">
          <strong>${item.title}</strong>
        </a>
        <div class="nav-end" aria-hidden="true">
          <span>End of guide</span>
        </div>
      </nav>
    </aside>
  </div>
</div>
