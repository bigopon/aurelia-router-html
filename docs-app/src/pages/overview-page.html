<section class="route-stack">
  <header class="page-header">
    <div>
      <h2>Routing that stays close to your HTML</h2>
      <p class="page-copy">
        Router HTML gives Aurelia applications composable routes, nested layouts, precise matching, and polished transitions directly in markup.
      </p>
    </div>
  </header>

  <div class="feature-catalog" data-e2e="overview-features">
    <article class="overview-feature" repeat.for="feature of features">
      <div class="overview-feature-copy">
        <h3>${feature.title}</h3>
        <p>${feature.summary}</p>
        <div class="overview-links">
          <a class="example-jump" href.bind="feature.path">Jump to example</a>
          <a class="example-jump" href.bind="playgroundPath(feature)">Edit in playground</a>
        </div>
      </div>
      <pre class="code-block overview-syntax" syntax-html>${feature.syntax}</pre>
    </article>
  </div>
</section>
